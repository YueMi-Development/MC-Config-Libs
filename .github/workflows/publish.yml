name: Publish API

on:
  push:
    branches:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Git User
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Verify and Update Version
        run: |
          BRANCH_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          GRADLE_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "Branch version: $BRANCH_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
          if [ "$BRANCH_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Versions differ. Updating gradle.properties..."
            sed -i "s/^version=.*/version=$BRANCH_VERSION/" gradle.properties
            git add gradle.properties
            git commit -m "chore: update version to $BRANCH_VERSION"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Versions match. No update needed."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :config-api:test --no-daemon

      - name: Publish to Maven repository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish
